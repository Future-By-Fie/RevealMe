name: RevealMe demo CI

on:
  push:
    branches: [main]
    paths:
      - "demo/lovable-mvp/**"
      - ".github/workflows/revealme-core-tests.yml"
  pull_request:
    paths:
      - "demo/lovable-mvp/**"
      - ".github/workflows/revealme-core-tests.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install dependencies
        working-directory: demo/lovable-mvp
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: demo/lovable-mvp
        run: bunx eslint . --fix && bun run lint
      - name: Test
        working-directory: demo/lovable-mvp
        run: bun run test
      - name: Build
        working-directory: demo/lovable-mvp
        run: bun run build
